name: Sprouttie availability
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/health.yml']
permissions:
  contents: read
jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check app and real database health
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 20 https://sprouttie.online/login > /dev/null
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 20 https://xqwrfbyqhuxveoqksuqz.supabase.co/functions/v1/health | python3 -c 'import json,sys; assert json.load(sys.stdin).get("ok") is True'
