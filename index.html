<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/sprouttie-mascot.png" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Sprouttie - Track your baby's learning journey with flashcards. The smart way to teach your little one." />

    <!-- Fonts: preconnect + link (not @import) so they fetch in parallel with the app bundle instead of after it, minimizing layout shift when the fallback font swaps in -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sprouttie" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Sprouttie — Mandarin Flashcard Tracker for Parents" />
    <meta property="og:description" content="A calm, structured system to teach your child Mandarin at home using the Glenn Doman method." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://sprouttie.online/images/sprouttie-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://sprouttie.online/images/sprouttie-og.png" />

    <title>Sprouttie - Baby Flashcard Tracker</title>
    

  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
